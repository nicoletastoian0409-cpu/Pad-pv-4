name: Generare APK PAD

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descarca proiectul
        uses: actions/checkout@v4

      - name: Instaleaza Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instaleaza Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extrage proiectul Android
        run: |
          unzip -o PAD_Android_Project_REPARAT.zip -d proiect

      - name: Genereaza APK
        run: |
          cd proiect/PAD_Android_Project
          gradle :app:assembleDebug --no-daemon

      - name: Salveaza APK
        uses: actions/upload-artifact@v4
        with:
          name: PAD-Proces-Verbal-APK
          path: proiect/PAD_Android_Project/app/build/outputs/apk/debug/app-debug.apk
